# Gated GitHub issues -> pm tracker sync. The audited pipeline lives in pm-github;
# this caller only owns the schedule. Requires Settings -> Actions -> "Allow GitHub
# Actions to create and approve pull requests" (enabled by the orchestrator).
name: Sync GitHub issues into pm
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write
jobs:
  gated-sync:
    if: github.repository == 'unbraind/pm-jev'
    uses: unbraind/pm-github/.github/workflows/pm-github-sync.yml@83bb51a2490f40c6a975c288447b28ea39d65825 # pm-github 2026.10.24
    with:
      pm-github-version: "2026.10.16"
