# Shared release transaction pinned to a verified canonical release.
name: Daily Release
on:
  schedule:
    - cron: 23 3 * * *
    - cron: 41 * * * *
  workflow_dispatch:
    inputs:
      retire-unpublished:
        description: Retire only owned untouched unpublished intent
        type: boolean
        default: false
permissions: {}
jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      id-token: write
      issues: write
    uses: unbraind/pm-ops/.github/workflows/daily-release.yml@7687a35d7522482bd8361d60dbc2589e9afbc81c # v2026.11.14
    with:
      reconcile-only: ${{ (github.event_name == 'schedule' && github.event.schedule ==
        '41 * * * *') || inputs.retire-unpublished == true }}
      retire-unpublished: ${{ github.event_name == 'workflow_dispatch' &&
        inputs.retire-unpublished == true }}
      release-enabled: ${{ github.repository == 'unbraind/pm-jev' && github.ref ==
        'refs/heads/main' && vars.PM_RELEASE_APPROVED == 'true' }}
