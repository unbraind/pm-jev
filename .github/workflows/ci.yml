name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                .agents/pm/*.mjs|.agents/pm/*.cjs|.agents/pm/*.js|.agents/pm/*.ts) code=true ;;
                .agents/pm/*.toon|.agents/pm/*.json|.agents/pm/*.jsonl|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Packed documentation checks exercise the Bun commands on the cheap path too.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully. `--require-merge-drivers` fails the gate when the
          # clone-local merge driver config declared by .gitattributes is absent.
          ./node_modules/.bin/pm health --strict-exit --require-merge-drivers


      - name: Build and verify committed output is current
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch 'dist/' > /dev/null 2>&1; then
            echo "::error::dist/ is not tracked. This package is installed by copying the repository, so the build output has to be in git."
            exit 1
          fi
          rm -rf dist
          npm run build
          drift=$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- 'dist/')
          if [ -n "$drift" ]; then
            echo "::error::Committed dist/ does not match a fresh build. Run 'npm run build' and commit the result."
            printf '%s\n' "$drift"
            exit 1
          fi
          echo "Committed dist/ matches a fresh build."

      - name: Documentation, tracker and public identity gates
        if: steps.changes.outputs.code != 'true'
        run: |
          npm run changelog:check
          npm run verify:public-provenance
          npm run verify:release-identity
          npm run pack:dry-run
          npm run verify:release-publish-attestation
          node -e 'JSON.parse(require("node:fs").readFileSync("docs/calibration-drift-evidence.json", "utf8"))'
          node --test test/identity-audit.test.ts test/source-provenance.test.ts test/admission-docs.test.ts test/admission-docs-install.test.ts test/agent-ux.test.ts test/release-approval.test.ts

      - name: Engines floor build and tests
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 22
        run: env HOME="$(mktemp -d)" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 npm test

      - name: Quick npm release gate
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: env HOME="$(mktemp -d)" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 npm run release:check

      - name: Bun package graph and bunx smoke
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: |
          bun install --no-save
          bunx --no-install pm --version
